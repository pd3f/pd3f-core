[project]
name = "pd3f"
version = "0.4.0"
description = "Reconstruct the original continuous text from PDFs with language models"
license = "AGPL-3.0-only"
authors = [{ name = "Johannes Filter", email = "hi@jfilter.de" }]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["pdf", "nlp", "german", "text-extraction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "clean-text[gpl]",
    "dehyphen>=0.4.0,<0.5",
    "joblib",
    "shapely",
    "textdistance",
]

[project.urls]
Repository = "https://github.com/pd3f/pd3f-core"
Documentation = "https://pd3f.github.io/pd3f-core/"

[dependency-groups]
dev = ["pdoc3", "pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# archived research notebooks, not part of the package
extend-exclude = ["development"]
