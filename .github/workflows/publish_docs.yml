name: publish docs

on:
    workflow_dispatch:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: build docs
              # pdoc imports the package, a CPU-only torch is enough for that
              run: |
                  pip install torch --index-url https://download.pytorch.org/whl/cpu
                  pip install . pdoc3
                  pdoc3 --html --output-dir docs pd3f

            - name: publish docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/pd3f
